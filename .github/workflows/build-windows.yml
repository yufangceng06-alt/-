name: Build Windows Desktop Pet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements.txt

      - name: Restore project folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets
          New-Item -ItemType Directory -Force pet_app
          Copy-Item sprite_sheet.png assets/sprite_sheet.png -Force
          Copy-Item app.py pet_app/app.py -Force
          Copy-Item __init__.py pet_app/__init__.py -Force

      - name: Build portable Windows app
        run: python -m PyInstaller --noconfirm --clean PinkHelmetPet.spec

      - name: Create download ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/PinkHelmetPet/*" -DestinationPath "PinkHelmetPet-Windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PinkHelmetPet-Windows-x64
          path: PinkHelmetPet-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
